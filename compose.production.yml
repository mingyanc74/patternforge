services:
  web:
    environment:
      DJANGO_DEBUG: '0'
      SESSION_COOKIE_SECURE: '1'
      SECURE_SSL_REDIRECT: '1'
      ALLOWED_HOSTS: ${DOMAIN},localhost,web
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
  gateway:
    image: caddy:2-alpine
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your server hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend]
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
