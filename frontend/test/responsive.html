<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rulecraft · Responsive UI verification</title>
  <style>
    body {margin: 0; padding: 16px; font: 13px system-ui; background: #e6edef; color: #20343e;}
    header {display: flex; align-items: center; gap: 18px; margin-bottom: 16px;}
    select {padding: 7px; font: inherit;}
    main {display: flex; gap: 20px; align-items: flex-start;}
    section {flex-shrink: 0;}
    h2 {font-size: 13px; margin: 0 0 8px;}
    iframe {display: block; height: 820px; border: 1px solid #bdcdd2; background: white;}
    output {display: block; margin: 8px 0; font-size: 12px;}
  </style>
</head>
<body>
  <header><strong>Local responsive UI fixture — not live AWS acceptance</strong>
    <label>View <select id="view"><option value="results">Results</option><option value="jobs">Jobs</option><option value="gate">Access gate</option></select></label>
  </header>
  <main>
    <section><h2>Phone · 390 px</h2><output id="phone-status">Loading</output><iframe title="Phone preview" width="390" id="phone"></iframe></section>
    <section><h2>Tablet · 768 px</h2><output id="tablet-status">Loading</output><iframe title="Tablet preview" width="768" id="tablet"></iframe></section>
  </main>
  <script>
    const selection = document.querySelector('#view');
    function update() {
      const suffix = selection.value === 'gate' ? '?gate=1' : selection.value === 'results' ? '#job=30000000-0000-4000-8000-000000000001' : '';
      for (const name of ['phone', 'tablet']) document.getElementById(name).src = './fixture.html' + suffix;
    }
    function measure() {
      for (const name of ['phone', 'tablet']) {
        const frame = document.getElementById(name), doc = frame.contentDocument;
        if (!doc || !doc.getElementById('root')?.children.length) continue;
        const viewport = doc.documentElement.clientWidth, content = doc.documentElement.scrollWidth;
        document.getElementById(name + '-status').textContent = `Viewport ${viewport}px / page width ${content}px / ${content <= viewport ? 'No page overflow' : 'OVERFLOW'}`;
      }
    }
    selection.addEventListener('change', update);
    update(); setInterval(measure, 1000);
  </script>
</body>
</html>
