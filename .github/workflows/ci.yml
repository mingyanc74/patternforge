name: Verify application
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_rows:
        description: Rows for the distributed end-to-end benchmark
        default: '1000'
        required: true
permissions:
  contents: read
jobs:
  unit-and-spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: 'backend/requirements*.txt'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: pip install -r backend/requirements-dev.txt -r backend/requirements-spark.txt
      - run: ruff check backend scripts
      - run: python -m pytest -q --junitxml=reports/local/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-test-results, path: reports/local/pytest.xml}
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
  distributed-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install boto3 requests openpyxl
      - run: python scripts/bootstrap.py
      - run: docker compose -f docker-compose.yml -f compose.ci.yml up -d --build --wait --wait-timeout 300
      - run: python scripts/smoke_e2e.py --rows ${{ inputs.benchmark_rows || '1000' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: distributed-e2e-report, path: reports/local/e2e.json}
      - name: Diagnose failing containers
        if: failure()
        run: docker compose -f docker-compose.yml -f compose.ci.yml ps
      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.yml -f compose.ci.yml down
